<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyDiary+ — Private & Stylish Diary</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #f0f4ff, #faf7ff);
  min-height: 100vh;
}
.card {
  transition: all 0.3s ease;
}
.card:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  animation: fadeIn 0.3s ease;
}
.modal-content {
  background: white;
  padding: 2rem;
  border-radius: 1rem;
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>

<body class="text-gray-800">

<!-- Navbar -->
<nav class="bg-white bg-opacity-90 shadow-md py-4 px-6 flex justify-between items-center sticky top-0">
  <h1 class="text-3xl font-extrabold text-indigo-600">📔 MyDiary+</h1>
  <button onclick="toggleForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition">+ New Entry</button>
</nav>

<!-- Form Section -->
<section id="form" class="hidden bg-white shadow-xl mx-auto mt-6 w-11/12 md:w-2/3 p-6 rounded-xl">
  <h2 class="text-xl font-semibold mb-3 text-indigo-700">📝 Write a new entry</h2>
  <input id="title" placeholder="Title..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400" />
  <textarea id="content" placeholder="What's on your mind today..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400 h-36"></textarea>
  <button onclick="saveEntry()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg">Save Entry</button>
</section>

<!-- Entries Display -->
<main id="entries" class="grid gap-6 mt-8 p-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></main>

<!-- Modal for Viewing Entries -->
<div id="viewModal" class="hidden modal">
  <div class="modal-content">
    <h2 id="viewTitle" class="text-2xl font-bold text-indigo-600 mb-2"></h2>
    <p id="viewContent" class="whitespace-pre-line text-gray-700 mb-4"></p>
    <div class="text-sm text-gray-500 mb-3" id="viewDate"></div>
    <div class="flex justify-end gap-3">
      <button onclick="copyContent()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-1 rounded-lg">📋 Copy Text</button>
      <button onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-1 rounded-lg">❌ Close</button>
    </div>
  </div>
</div>

<script>
let db;
let currentContent = "";

// Initialize IndexedDB
const request = indexedDB.open("MyDiaryDB", 3);
request.onerror = () => alert("Error opening database.");
request.onsuccess = e => { db = e.target.result; displayEntries(); };
request.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("entries")) {
    const store = db.createObjectStore("entries", { keyPath: "id", autoIncrement: true });
    store.createIndex("title", "title", { unique: false });
  }
};

// Toggle form
function toggleForm() {
  document.getElementById("form").classList.toggle("hidden");
}

// Save new entry
function saveEntry() {
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  if (!title || !content) { alert("Please fill in both fields."); return; }

  const tx = db.transaction("entries", "readwrite");
  const store = tx.objectStore("entries");
  store.add({ title, content, date: new Date().toISOString() });

  tx.oncomplete = () => {
    document.getElementById("title").value = '';
    document.getElementById("content").value = '';
    toggleForm();
    displayEntries();
  };
}

// Display all entries (showing only 5 words preview)
function displayEntries() {
  const tx = db.transaction("entries", "readonly");
  const store = tx.objectStore("entries");
  const req = store.getAll();

  req.onsuccess = e => {
    const entries = e.target.result.reverse();
    const container = document.getElementById("entries");
    container.innerHTML = '';
    if (entries.length === 0) {
      container.innerHTML = "<p class='text-center text-gray-500 mt-10'>No entries yet. Start writing something! ✨</p>";
      return;
    }

    entries.forEach(entry => {
      const date = new Date(entry.date).toLocaleString();
      const preview = entry.content.split(" ").slice(0, 5).join(" ") + (entry.content.split(" ").length > 5 ? "..." : "");
      container.innerHTML += `
        <div class="card bg-white p-5 rounded-xl shadow-lg cursor-pointer" onclick="openEntry(${entry.id})">
          <h3 class="text-xl font-bold text-indigo-600 mb-2">${entry.title}</h3>
          <p class="text-gray-700 italic mb-2">${preview}</p>
          <div class="text-sm text-gray-500">${date}</div>
        </div>`;
    });
  };
}

// Open selected entry
function openEntry(id) {
  const tx = db.transaction("entries", "readonly");
  const store = tx.objectStore("entries");
  const req = store.get(id);
  req.onsuccess = e => {
    const entry = e.target.result;
    if (!entry) return;
    currentContent = entry.content;
    document.getElementById("viewTitle").textContent = entry.title;
    document.getElementById("viewContent").textContent = entry.content;
    document.getElementById("viewDate").textContent = new Date(entry.date).toLocaleString();
    document.getElementById("viewModal").classList.remove("hidden");
  };
}

// Copy text to clipboard
function copyContent() {
  navigator.clipboard.writeText(currentContent).then(() => {
    alert("📋 Diary content copied successfully!");
  });
}

// Close modal
function closeModal() {
  document.getElementById("viewModal").classList.add("hidden");
}
</script>
</body>
</html>
