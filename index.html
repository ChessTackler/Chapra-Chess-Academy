<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyDiary+ — Secure Personal Diary</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;background:linear-gradient(120deg,#e0e7ff,#f5f3ff);}
.card{transition:all .3s ease;}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 8px 16px rgba(0,0,0,0.15);}
</style>
</head>
<body class="text-gray-800">

<nav class="bg-white bg-opacity-90 shadow-md py-4 px-6 flex justify-between items-center">
  <h1 class="text-3xl font-bold text-indigo-600">📘 MyDiary+</h1>
  <button onclick="toggleForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg">+ New Entry</button>
</nav>

<section id="form" class="hidden bg-white shadow-xl mx-auto mt-6 w-11/12 md:w-2/3 p-6 rounded-xl">
  <input id="title" placeholder="Title..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400">
  <textarea id="content" placeholder="Write your thoughts..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400 h-36"></textarea>
  <button onclick="saveEntry()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg">Save Entry</button>
</section>

<main id="entries" class="grid gap-6 mt-8 p-6 md:grid-cols-2 lg:grid-cols-3"></main>

<script>
let db;

// Initialize IndexedDB
const request = indexedDB.open("MyDiaryDB", 1);
request.onerror = () => alert("Error opening database.");
request.onsuccess = (e) => { db = e.target.result; displayEntries(); };
request.onupgradeneeded = (e) => {
  db = e.target.result;
  const store = db.createObjectStore("entries", { keyPath: "id", autoIncrement: true });
  store.createIndex("title", "title", { unique: false });
};

// Toggle form visibility
function toggleForm() {
  document.getElementById('form').classList.toggle('hidden');
}

// Save new entry
function saveEntry() {
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();
  if (!title || !content) { alert("Please fill in both fields."); return; }

  const tx = db.transaction("entries", "readwrite");
  const store = tx.objectStore("entries");
  const entry = { title, content, date: new Date().toISOString() };
  store.add(entry);

  tx.oncomplete = () => {
    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
    toggleForm();
    displayEntries();
  };
}

// Display saved entries
function displayEntries() {
  if (!db) return;
  const tx = db.transaction("entries", "readonly");
  const store = tx.objectStore("entries");
  const req = store.getAll();
  req.onsuccess = (e) => {
    const entries = e.target.result.reverse();
    const container = document.getElementById("entries");
    container.innerHTML = '';
    if (entries.length === 0) {
      container.innerHTML = "<p class='text-center text-gray-500 mt-10'>No entries yet.</p>";
      return;
    }
    entries.forEach(entry => {
      const date = new Date(entry.date).toLocaleString();
      container.innerHTML += `
        <div class="card bg-white p-5 rounded-xl shadow-lg">
          <h3 class="text-xl font-bold text-indigo-600 mb-2">${entry.title}</h3>
          <p class="text-gray-700 mb-3 whitespace-pre-line">${entry.content}</p>
          <div class="text-sm text-gray-500">${date}</div>
        </div>`;
    });
  };
}
</script>

</body>
</html>
