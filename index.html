<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDiary+ ✨ Animated Universe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/uuid@9.0.0/dist/umd/uuidv4.min.js"></script>
  <style>
    /* Global theme */
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #f0f9ff, #e0e7ff, #c7d2fe);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      color: #222;
    }

    /* Floating background lights */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      animation: float 10s linear infinite;
      opacity: 0.6;
    }

    @keyframes float {
      0% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-100px) translateX(50px); }
      100% { transform: translateY(0) translateX(0); }
    }

    /* Animated text glow */
    .glow {
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px #6366f1, 0 0 10px #818cf8, 0 0 15px #c7d2fe; }
      to { text-shadow: 0 0 15px #6366f1, 0 0 25px #818cf8, 0 0 35px #c7d2fe; }
    }

    /* Card hover effect */
    .card {
      transition: all 0.4s ease;
    }
    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    /* Character style */
    .character {
      background: rgba(255,255,255,0.85);
      border-radius: 1rem;
      padding: 1rem;
      width: 240px;
      text-align: center;
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      animation: fadeIn 2s ease;
      z-index: 50;
    }

    .character img {
      width: 120px;
      animation: floatCharacter 3s ease-in-out infinite;
    }

    @keyframes floatCharacter {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Emoji Picker */
    .emoji-picker span {
      font-size: 20px;
      cursor: pointer;
      margin: 4px;
      transition: 0.2s;
    }
    .emoji-picker span:hover {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div id="particles"></div>

  <!-- Navbar -->
  <nav class="bg-white bg-opacity-80 shadow-md py-4 px-6 flex justify-between items-center backdrop-blur-md">
    <h1 class="text-3xl font-extrabold text-indigo-600 glow">🌟 MyDiary+ Universe</h1>
    <div class="flex gap-4 items-center">
      <div id="clock" class="font-mono text-gray-700 text-lg"></div>
      <button onclick="toggleForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow-md transition-all duration-200 transform hover:scale-105">+ New Post</button>
    </div>
  </nav>

  <!-- Post Form -->
  <section id="postForm" class="hidden bg-white bg-opacity-90 shadow-xl mx-auto mt-6 w-11/12 md:w-2/3 p-6 rounded-2xl backdrop-blur-md">
    <h2 class="text-2xl font-semibold mb-4 text-indigo-700 glow">📝 Write Your Diary or Blog Post</h2>
    <input id="title" type="text" placeholder="Enter your title..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400 outline-none">
    <textarea id="content" placeholder="Write your story, feelings, or thoughts..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400 outline-none h-36"></textarea>
    
    <!-- Emoji Picker -->
    <div class="emoji-picker mb-4">
      <span onclick="addEmoji('😊')">😊</span>
      <span onclick="addEmoji('🔥')">🔥</span>
      <span onclick="addEmoji('💭')">💭</span>
      <span onclick="addEmoji('🌈')">🌈</span>
      <span onclick="addEmoji('🎮')">🎮</span>
      <span onclick="addEmoji('❤️')">❤️</span>
      <span onclick="addEmoji('🌻')">🌻</span>
      <span onclick="addEmoji('✨')">✨</span>
      <span onclick="addEmoji('🚀')">🚀</span>
      <span onclick="addEmoji('😎')">😎</span>
    </div>

    <button onclick="savePost()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg shadow-md transform hover:scale-105 transition-all">📤 Publish</button>
  </section>

  <!-- Posts Section -->
  <main id="posts" class="grid gap-6 mt-8 p-6 md:grid-cols-2 lg:grid-cols-3"></main>

  <!-- Character Assistant -->
  <div class="character">
    <img id="charImg" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Companion">
    <p id="charDialogue" class="text-gray-700 font-medium mt-2">
      Hi! I'm <span class="text-indigo-600 font-bold">Auri</span> 🌸 — here to guard your thoughts.
    </p>
  </div>

  <footer class="mt-16 text-center py-6 text-gray-600">
    © 2025 MyDiary+ Universe. Built with 💫 imagination and code.
  </footer>

  <script>
    // Floating particles
    const particles = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDuration = (8 + Math.random() * 5) + 's';
      particle.style.animationDelay = Math.random() * 5 + 's';
      particles.appendChild(particle);
    }

    // Live clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Toggle form
    function toggleForm() {
      document.getElementById('postForm').classList.toggle('hidden');
      changeCharacterMood('thinking');
    }

    // Add emoji
    function addEmoji(emoji) {
      document.getElementById('content').value += emoji;
      changeCharacterMood('happy');
    }

    // Character moods
    function changeCharacterMood(mood) {
      const img = document.getElementById('charImg');
      const dialogue = document.getElementById('charDialogue');
      if (mood === 'thinking') {
        dialogue.textContent = "🤔 Let’s see what’s on your mind today...";
      } else if (mood === 'happy') {
        dialogue.textContent = "Hehe! That emoji looks awesome 😍";
      } else if (mood === 'save') {
        dialogue.textContent = "Your words are now safe with me 🛡️✨";
      }
    }

    // Load posts
    function loadPosts() {
      const posts = JSON.parse(localStorage.getItem('posts') || '[]');
      const postsContainer = document.getElementById('posts');
      postsContainer.innerHTML = '';
      posts.reverse().forEach(post => {
        const card = document.createElement('div');
        card.className = 'card bg-white bg-opacity-90 p-5 rounded-2xl shadow-lg flex flex-col justify-between backdrop-blur-md animate-fadeIn';
        card.innerHTML = `
          <div>
            <h3 class="text-2xl font-bold mb-2 text-indigo-600">${post.title}</h3>
            <p class="text-gray-700 mb-3 whitespace-pre-line">${post.content}</p>
          </div>
          <div class="flex justify-between items-center mt-3">
            <span class="text-sm text-gray-500">${new Date(post.date).toLocaleString()}</span>
            <div class="flex gap-3">
              <button onclick="shareWhatsApp('${encodeURIComponent(post.title)}', '${encodeURIComponent(post.content)}')" class="text-green-600 hover:text-green-700">📱</button>
              <button onclick="copyLink('${post.id}')" class="text-gray-600 hover:text-gray-800">🔗</button>
            </div>
          </div>
        `;
        postsContainer.appendChild(card);
      });
    }

    // Save post
    function savePost() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      if (!title || !content) {
        alert('Please fill in both fields.');
        return;
      }
      const post = {
        id: uuidv4(),
        title,
        content,
        date: new Date().toISOString()
      };
      const posts = JSON.parse(localStorage.getItem('posts') || '[]');
      posts.push(post);
      localStorage.setItem('posts', JSON.stringify(posts));
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      toggleForm();
      loadPosts();
      changeCharacterMood('save');
    }

    // Share via WhatsApp
    function shareWhatsApp(title, content) {
      const url = `https://wa.me/?text=${title}%0A${content}`;
      window.open(url, '_blank');
    }

    // Copy post link
    function copyLink(id) {
      const dummyLink = `${window.location.origin}${window.location.pathname}?post=${id}`;
      navigator.clipboard.writeText(dummyLink);
      alert('Post link copied to clipboard!');
    }

    loadPosts();
  </script>
</body>
</html>
