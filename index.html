<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDiary ✨ — Personal Diary & Blog</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/uuid@9.0.0/dist/umd/uuidv4.min.js"></script>
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
  min-height: 100vh;
  color: #333;
}
.card {transition: all .3s ease;}
.card:hover {transform: translateY(-5px) scale(1.02); box-shadow: 0 12px 24px rgba(0,0,0,.15);}
.glow {animation: glow 2s ease-in-out infinite alternate;}
@keyframes glow {
  from {text-shadow: 0 0 5px #818cf8, 0 0 15px #6366f1;}
  to {text-shadow: 0 0 15px #818cf8, 0 0 25px #6366f1;}
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="bg-white bg-opacity-90 shadow-md py-4 px-6 flex justify-between items-center">
  <h1 class="text-3xl font-extrabold text-indigo-600 glow">🪶 MyDiary+</h1>
  <button onclick="toggleForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow-md">+ New Entry</button>
</nav>

<!-- Post Form -->
<section id="postForm" class="hidden bg-white bg-opacity-90 shadow-xl mx-auto mt-6 w-11/12 md:w-2/3 p-6 rounded-2xl">
  <h2 class="text-2xl font-semibold mb-4 text-indigo-700">✍️ Write a New Diary Entry</h2>
  <input id="title" type="text" placeholder="Title..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400 outline-none">
  <textarea id="content" placeholder="Write your thoughts..." class="border w-full mb-3 px-3 py-2 rounded-md focus:ring-2 focus:ring-indigo-400 outline-none h-36"></textarea>
  <button onclick="savePost()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg shadow-md">💾 Save Entry</button>
</section>

<!-- Posts Section -->
<main id="posts" class="grid gap-6 mt-8 p-6 md:grid-cols-2 lg:grid-cols-3"></main>

<footer class="mt-12 text-center py-6 text-gray-500">
  © 2025 MyDiary+ | Your personal space to write, remember, and share 💌
</footer>

<script>
// Toggle form visibility
function toggleForm() {
  document.getElementById('postForm').classList.toggle('hidden');
}

// Load posts from LocalStorage
function loadPosts() {
  const posts = JSON.parse(localStorage.getItem('posts') || '[]');
  const postsContainer = document.getElementById('posts');
  postsContainer.innerHTML = '';

  const params = new URLSearchParams(window.location.search);
  const viewPost = params.get('post');

  if (viewPost) {
    const found = posts.find(p => p.id === viewPost);
    if (found) {
      postsContainer.innerHTML = renderSinglePost(found);
    } else {
      postsContainer.innerHTML = `<p class='text-center text-gray-600 mt-10'>⚠️ Entry not found.</p>`;
    }
    return;
  }

  if (posts.length === 0) {
    postsContainer.innerHTML = `<p class='text-center text-gray-600 mt-10'>No entries yet — start writing your first one!</p>`;
    return;
  }

  posts.reverse().forEach(post => postsContainer.innerHTML += renderPost(post));
}

// Render single post view
function renderSinglePost(post) {
  const link = `${location.origin}${location.pathname}?post=${post.id}`;
  return `
    <div class="card bg-white p-6 rounded-2xl shadow-lg mx-auto md:w-2/3">
      <h2 class="text-3xl font-bold text-indigo-600 mb-3">${post.title}</h2>
      <p class="whitespace-pre-line text-gray-700 leading-relaxed mb-4">${post.content}</p>
      <div class="text-sm text-gray-500 mb-4">${new Date(post.date).toLocaleString()}</div>
      <div class="flex justify-between items-center">
        <button onclick="copyLink('${link}')" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-1 rounded-lg">🔗 Copy Link</button>
        <a href="${location.pathname}" class="text-indigo-600 hover:underline">← Back to Diary</a>
      </div>
    </div>
  `;
}

// Render all posts
function renderPost(post) {
  const link = `${location.origin}${location.pathname}?post=${post.id}`;
  return `
    <div class="card bg-white p-5 rounded-2xl shadow-lg flex flex-col justify-between">
      <div>
        <h3 class="text-2xl font-bold mb-2 text-indigo-600">${post.title}</h3>
        <p class="text-gray-700 mb-3 whitespace-pre-line">${post.content.substring(0, 120)}${post.content.length > 120 ? '...' : ''}</p>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-500">${new Date(post.date).toLocaleString()}</span>
        <div class="flex gap-3">
          <button onclick="shareWhatsApp('${encodeURIComponent(post.title)}','${encodeURIComponent(post.content)}','${link}')" class="text-green-600 hover:text-green-700">📱</button>
          <button onclick="copyLink('${link}')" class="text-gray-600 hover:text-gray-800">🔗</button>
          <a href="${link}" class="text-indigo-600 hover:underline">View</a>
        </div>
      </div>
    </div>
  `;
}

// Save new post
function savePost() {
  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();

  if (!title || !content) {
    alert('Please fill in both the title and content.');
    return;
  }

  const post = {
    id: uuidv4(),
    title,
    content,
    date: new Date().toISOString()
  };

  const posts = JSON.parse(localStorage.getItem('posts') || '[]');
  posts.push(post);
  localStorage.setItem('posts', JSON.stringify(posts));

  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  toggleForm();
  loadPosts();

  alert('✅ Entry saved to your diary! You can now view or share it.');
}

// Share via WhatsApp
function shareWhatsApp(title, content, link) {
  const msg = `${decodeURIComponent(title)}%0A${decodeURIComponent(content)}%0A🔗 ${link}`;
  window.open(`https://wa.me/?text=${msg}`, '_blank');
}

// Copy post link
function copyLink(link) {
  navigator.clipboard.writeText(link);
  alert('📋 Post link copied to clipboard!');
}

loadPosts();
</script>

</body>
</html>
